plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lifemastery.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.lifemastery.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Always bundle the latest web app into the APK
tasks.register('copyWeb', Copy) {
    from "$rootDir/../web"
    include 'index.html', 'icon.svg', 'manifest.json'
    into "$projectDir/src/main/assets"
}
preBuild.dependsOn 'copyWeb'
